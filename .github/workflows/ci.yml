name: Environmental Intelligence Pipeline CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  security-checks:
    name: Security & Repository Safeguards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secrets & Exclusions in Tracked Files
        run: |
          echo "Checking git index for forbidden tracked secrets..."
          if git ls-files | grep -E '^\.env$'; then
            echo "::error::Tracked .env file detected in repository!"
            exit 1
          fi
          echo "Repository security scan passed. No tracked .env detected."

  backend-tests:
    name: Run Pytest Suite & Code Quality
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Code Quality Checks
        run: |
          ruff check --select E9,F backend etl kafka prefect tests

      - name: Run Automated Pytest Suite with Coverage
        env:
          OPENAQ_API_KEY: "test_mock_ci_key"
        run: |
          python -m pytest -v --junitxml=pytest-results.xml --cov=. --cov-report=xml:coverage.xml

      - name: Upload Test & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-and-coverage-results
          path: |
            pytest-results.xml
            coverage.xml

  frontend-tests:
    name: Run Vitest Suite & Build Frontend
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build

  docker-validation:
    name: Validate Docker Config & Build
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config

      - name: Build Docker Stack
        env:
          OPENAQ_API_KEY: "test_mock_ci_key"
        run: |
          docker compose build
