name: Release & GHCR Image Publishing

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-validate:
    name: Validate Suite & Docker Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Code Quality Check
        run: |
          ruff check --select E9,F backend etl kafka prefect tests

      - name: Run Python Pytest Suite
        env:
          OPENAQ_API_KEY: "test_mock_ci_key"
        run: |
          python -m pytest -v --junitxml=pytest-results.xml

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Run Vitest Tests
        run: |
          cd frontend
          npm install
          npm test

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  publish-ghcr:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-frontend:${{ github.sha }}

      - name: Build & Push Kafka Producer Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/producer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-producer:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-producer:${{ github.sha }}

      - name: Build & Push Kafka Consumer Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/consumer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-consumer:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/environmental-intelligence-consumer:${{ github.sha }}

      - name: Generate GHCR Publish Summary Report
        run: |
          OWNER="${{ steps.repo_owner.outputs.owner }}"
          SHA="${{ github.sha }}"
          echo "### 🚀 Phase 9 Docker Image Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "The following production images were published to GHCR:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${OWNER}/environmental-intelligence-backend:latest\` (\`${SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${OWNER}/environmental-intelligence-frontend:latest\` (\`${SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${OWNER}/environmental-intelligence-producer:latest\` (\`${SHA}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${OWNER}/environmental-intelligence-consumer:latest\` (\`${SHA}\`)" >> $GITHUB_STEP_SUMMARY
