services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: env_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_engineering}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-data_engineering}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env_net

  # 2. Redis Fast Real-Time Store
  redis:
    image: redis:7-alpine
    container_name: env_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env_net

  # 3. Apache Kafka Event Streaming Broker (KRaft Mode)
  kafka:
    image: apache/kafka:latest
    container_name: env_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env_net

  # 4. One-Time Kafka Topic Initialization
  kafka-topic-init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: env_kafka_topic_init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "kafka/setup_topics.py"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - env_net

  # 5. Prefect Pipeline Orchestration Server
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: env_prefect_server
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-data_engineering}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env_net

  # 6. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: env_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-data_engineering}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - env_net

  # 7. Kafka Live Stream Producer Service
  kafka-producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: env_kafka_producer
    restart: unless-stopped
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAQ_POLL_INTERVAL: ${OPENAQ_POLL_INTERVAL:-30}
      USGS_POLL_INTERVAL: ${USGS_POLL_INTERVAL:-30}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    networks:
      - env_net

  # 8. Kafka Live Stream Consumer Service
  kafka-consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: env_kafka_consumer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    networks:
      - env_net

  # 9. React Frontend Production Nginx Service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: env_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - env_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  env_net:
    driver: bridge
